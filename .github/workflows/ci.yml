name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:gas
      - name: deploy/apps-script ต้องตรงกับ source (รัน npm run build:gas แล้ว commit)
        run: git diff --exit-code -- deploy/apps-script
      - run: npm test
      - run: npm run build:web
      - name: Upload Apps Script bundle
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-Code.gs
          path: apps/gas/dist/
